<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Watercolor Effect</title>
    <style>
        /* 1. CREAM CANVAS BACKGROUND */
        :root {
            /* Default fallback colors, overridden by JavaScript */
            --color1: #E12AFB;
            --color2: #34A6F4;
            --color3: #F0B13B;
            --color4: #2AA63E;
        }

        body {
            /* Cream/Beige Canvas Color */
            background-color: #F5F5DC;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 2. WATERCOLOR EFFECT LAYER */
        #watercolor-effect {
            /* Fixed position, covering a larger area than the viewport */
            position: fixed;
            top: -50vh;
            left: -50vw;
            width: 200vw;
            height: 200vh;
            
            /* The magic: multiple large, radial gradients heavily blurred
               to simulate spreading watercolor paint. */
            background:
                /* Blob 1: Random Position 1 */
                radial-gradient(circle at 10% 20%, var(--color1) 0%, transparent 40%),
                /* Blob 2: Random Position 2 */
                radial-gradient(circle at 70% 30%, var(--color2) 0%, transparent 45%),
                /* Blob 3: Random Position 3 */
                radial-gradient(circle at 40% 80%, var(--color3) 0%, transparent 50%),
                /* Blob 4: Random Position 4 */
                radial-gradient(circle at 90% 90%, var(--color4) 0%, transparent 55%);
            
            /* Massive blur for the soft, watery look */
            filter: blur(100px) opacity(0.8) url(#grain); 
            
            /* Blends the colors together like real paint */
            mix-blend-mode: multiply; 
            
            /* Makes the color change smooth on page reload/DOM manipulation */
            transition: background 1.5s ease-out;
        }

        /* 3. GLARE EFFECT LAYER */
        #glare-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicks to pass through to elements below */
            
            /* A subtle off-center white gradient for the unique glare/wet look */
            background: radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
            opacity: 0.5;
            mix-blend-mode: overlay; /* Creates a nice bright spot */
        }

        /* 4. SVG FILTER FOR CANVAS/GRAIN TEXTURE */
        .svg-filters {
            display: none; /* Hide the SVG element from the page */
        }
    </style>
</head>
<body>
    <div id="watercolor-effect"></div>

    <div id="glare-effect"></div>

    <svg class="svg-filters">
        <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
            <feDiffuseLighting in="noise" lightingColor="#F5F5DC" surfaceScale="5" result="diffuse" />
            <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" />
        </filter>
    </svg>

    <script>
        // 5. JAVASCRIPT FOR DYNAMIC COLOR PALETTE
        document.addEventListener('DOMContentLoaded', () => {
            
            // Extracted hex codes (mostly 500-600 shades) from the Tailwind Color Chart
            const tailwindColors = [
                '#F4320B', '#FF692A', '#E1712B', '#F0B13B', 
                '#5EA529', '#31C950', '#2D9966', '#36BBA7', 
                '#3BB8DB', '#34A6F4', '#155DFC', '#615FFF', 
                '#8E51FF', '#AD46FF', '#E12AFB', '#FF2056'
            ];
            
            const numBlobs = 4; // We are using 4 colors/gradients
            const selectedColors = [];
            const root = document.documentElement;

            // Function to randomly select colors without repetition
            function selectRandomColors(count) {
                const colorsCopy = [...tailwindColors];
                for (let i = 0; i < count; i++) {
                    const randomIndex = Math.floor(Math.random() * colorsCopy.length);
                    selectedColors.push(colorsCopy.splice(randomIndex, 1)[0]);
                }
            }
            
            // Function to generate random positions for the blobs (0-100%)
            function generateRandomPosition() {
                return `${Math.floor(Math.random() * 100)}%`;
            }

            // Run the setup
            selectRandomColors(numBlobs);

            // Apply the colors and positions as CSS variables
            selectedColors.forEach((color, index) => {
                root.style.setProperty(`--color${index + 1}`, color);
                
                // Set the gradient positions slightly randomly for visual interest
                root.style.setProperty(`--p${index + 1}-x`, generateRandomPosition());
                root.style.setProperty(`--p${index + 1}-y`, generateRandomPosition());
            });
            
            // Note: The actual background is defined in the CSS <style> block,
            // which uses these CSS variables (--color1, --p1-x, etc.)
            
            console.log("Watercolor palette loaded:", selectedColors);
        });
    </script>
</body>
</html>
